# Canonical skill names + alias mappings. The normalizer rewrites any alias
# to its canonical form before trend counting. Keep this list focused on the
# domains the project covers (AI / software / data / infra).

canonical:
  Python: [python, py, python3]
  Go: [golang, "go lang"]
  Rust: [rust-lang, rustlang]
  TypeScript: [ts, typescript]
  JavaScript: [js, javascript, ecmascript]
  React: [react.js, reactjs, react]
  PyTorch: [torch, pytorch]
  TensorFlow: [tf, tensorflow]
  JAX: [jax]
  vLLM: [vllm]
  Triton: [triton, openai triton]
  CUDA: [cuda, nvidia cuda]
  Kubernetes: [k8s, kube, kubernetes]
  Docker: [docker]
  Terraform: [terraform, tf-iac]
  AWS: [aws, amazon web services]
  GCP: [gcp, google cloud, google cloud platform]
  Azure: [azure, microsoft azure]
  PostgreSQL: [postgres, postgresql, pg]
  Redis: [redis]
  Kafka: [kafka, apache kafka]
  Spark: [spark, apache spark]
  Ray: [ray, anyscale ray]
  Airflow: [airflow, apache airflow]
